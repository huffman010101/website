name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/gifted-fermi-5z5bgt
      - claude/vibrant-cori-87quqp

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The gym app is built into dist/gym so it is reachable at /website/gym/.
      # It is deliberately NOT linked from this site — the only way in is the direct URL.
      - name: Checkout gym app
        uses: actions/checkout@v4
        with:
          repository: huffman010101/gym
          ref: claude/vibrant-cori-87quqp
          path: gym-src

      - name: Build gym app
        run: |
          cd gym-src
          npm install
          npm run build
          mkdir -p ../dist/gym
          cp -r dist/* ../dist/gym/

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
